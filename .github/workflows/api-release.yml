name: Controlled API release
on:
  workflow_call:
    inputs:
      revision:
        description: Exact checked commit on the selected trusted branch (also for compatible rollback)
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: swapcircle-staging-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'sen0mar/SwapCircle' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 35
    env:
      RELEASE_REVISION: ${{ inputs.revision }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Require successful checks on this exact trusted revision
        run: node scripts/api-release.mjs checks
      - run: pnpm install --frozen-lockfile
      - name: Verify and apply reviewed compatible migrations
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
          DATABASE_CA_CERT_PATH: ${{ runner.temp }}/supabase-ca.crt
          HOSTED_AUTHORIZATION: configure-approved-project
          HOSTED_REVIEWED_MIGRATION_SHA256: a3b4e7945b9ce81257aa83344e2b7b77af0a243031e21396ef73a356122bd29d
          SUPABASE_URL: https://tpanyqfgmbpsiejqjocd.supabase.co
          FRONTEND_URL: https://swapcircle-staging.pages.dev
        run: |
          umask 077
          printf '%s' "$DATABASE_CA_CERT" > "$DATABASE_CA_CERT_PATH"
          trap 'rm -f "$DATABASE_CA_CERT_PATH"' EXIT
          pnpm --filter @swapcircle/database exec node scripts/release-migrations.ts
      - name: Deploy and verify the intended healthy API build
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          RENDER_API_URL: ${{ vars.RENDER_API_URL }}
        run: node scripts/api-release.mjs deploy
