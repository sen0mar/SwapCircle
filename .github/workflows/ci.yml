name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @swapcircle/web exec playwright install --with-deps chromium
      - run: pnpm test:browser
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:start
      - run: pnpm db:setup
      - run: pnpm db:reset
      - run: pnpm db:verify
      - run: pnpm --filter @swapcircle/api test:auth-local
      - run: pnpm --filter @swapcircle/api test:profiles-local
      - run: pnpm --filter @swapcircle/api test:listings-local
      - run: pnpm --filter @swapcircle/api test:photos-local
      - run: pnpm --filter @swapcircle/api test:discovery-local
      - run: pnpm --filter @swapcircle/api test:safety-local
      - run: pnpm --filter @swapcircle/api test:conversations-local
      - run: pnpm --filter @swapcircle/api test:messages-local
      - run: pnpm --filter @swapcircle/api test:unread-local
      - run: pnpm --filter @swapcircle/web exec playwright install --with-deps chromium
      - run: pnpm --filter @swapcircle/web test:catalog-local
      - run: pnpm --filter @swapcircle/web test:safety-local
      - run: pnpm --filter @swapcircle/web test:inbox-local
      - run: pnpm --filter @swapcircle/web test:composer-local
      - run: pnpm --filter @swapcircle/web test:realtime-local
      - run: pnpm --filter @swapcircle/web test:unread-local
      - if: always()
        run: pnpm db:stop
