name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      api_release_revision:
        description: Optional exact checked SHA for a controlled API release
        required: false
        type: string
      frontend_release_revision:
        description: Optional exact checked SHA for a controlled API and frontend release
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && (inputs.api_release_revision != '' || inputs.frontend_release_revision != '') && github.run_id || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.api_release_revision != '' || inputs.frontend_release_revision != '')) }}
jobs:
  checks:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @swapcircle/web exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - run: pnpm --filter @swapcircle/web test:release-build
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failure-evidence
          path: apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore
  database:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The prior full database job used 18 minutes before pairwise coffee coverage.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:start
      - run: pnpm db:setup
      - run: pnpm db:reset
      - run: pnpm db:verify
      - name: Verify migration generation has no drift
        run: |
          pnpm --filter @swapcircle/database generate
          test -z "$(git status --porcelain -- packages/database/migrations)"
      - run: pnpm test:api-local
      - run: pnpm --filter @swapcircle/web exec playwright install --with-deps chromium
      - run: pnpm test:journeys-local
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: local-suite-failure-evidence
          path: |
            test-results/local-*-failure.json
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore
      - if: always()
        run: pnpm db:stop
  private-source-maps:
    # Explicit dispatch is a trusted maintainer operation; PRs never receive secrets.
    if: (github.event_name == 'workflow_dispatch' && inputs.api_release_revision == '' && inputs.frontend_release_revision == '') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build with private maps and public revision
        env:
          SENTRY_SOURCE_MAPS: '1'
          VITE_BUILD_REVISION: ${{ github.sha }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
        run: |
          pnpm build
          pnpm --filter @swapcircle/api exec tsc --sourceMap --inlineSources
      - name: Upload and remove private maps
        env:
          BUILD_REVISION: ${{ github.sha }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_API_PROJECT: ${{ vars.SENTRY_API_PROJECT }}
          SENTRY_WEB_PROJECT: ${{ vars.SENTRY_WEB_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: node scripts/sentry-source-maps.mjs
  api-release:
    if: github.repository == 'sen0mar/SwapCircle' && github.event_name == 'workflow_dispatch' && (inputs.api_release_revision != '' || inputs.frontend_release_revision != '')
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 55
    concurrency:
      group: swapcircle-production-release
      cancel-in-progress: false
    env:
      RELEASE_REVISION: ${{ inputs.frontend_release_revision || inputs.api_release_revision }}
      API_RELEASE_REVISION: ${{ inputs.api_release_revision }}
      FRONTEND_RELEASE_REVISION: ${{ inputs.frontend_release_revision }}
      VITE_API_URL: https://swapcircle-staging-api.onrender.com
      VITE_SUPABASE_URL: https://tpanyqfgmbpsiejqjocd.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_BUILD_REVISION: ${{ inputs.frontend_release_revision || inputs.api_release_revision }}
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Require successful checks on this exact trusted revision
        run: node scripts/api-release.mjs checks
      - run: pnpm install --frozen-lockfile
      - name: Verify and apply reviewed compatible migrations
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
          DATABASE_CA_CERT_PATH: ${{ runner.temp }}/supabase-ca.crt
          HOSTED_AUTHORIZATION: configure-approved-project
          HOSTED_REVIEWED_MIGRATION_SHA256: a3b4e7945b9ce81257aa83344e2b7b77af0a243031e21396ef73a356122bd29d
          SUPABASE_URL: https://tpanyqfgmbpsiejqjocd.supabase.co
          FRONTEND_URL: https://swapcircle.pages.dev
        run: |
          umask 077
          printf '%s' "$DATABASE_CA_CERT" > "$DATABASE_CA_CERT_PATH"
          trap 'rm -f "$DATABASE_CA_CERT_PATH"' EXIT
          pnpm --filter @swapcircle/database exec node scripts/release-migrations.ts
      - name: Deploy and verify the intended healthy API build
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          RENDER_API_URL: ${{ vars.RENDER_API_URL }}
        run: node scripts/api-release.mjs deploy
      - name: Build browser-only assets and private API maps
        if: inputs.frontend_release_revision != ''
        run: |
          pnpm --filter @swapcircle/api... build
          pnpm --filter @swapcircle/api exec tsc --sourceMap --inlineSources
          node scripts/frontend-release.mjs build
      - name: Upload and remove release source maps
        if: inputs.frontend_release_revision != ''
        env:
          BUILD_REVISION: ${{ inputs.frontend_release_revision }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_API_PROJECT: ${{ vars.SENTRY_API_PROJECT }}
          SENTRY_WEB_PROJECT: ${{ vars.SENTRY_WEB_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: node scripts/sentry-source-maps.mjs
      - name: Audit public frontend assets
        if: inputs.frontend_release_revision != ''
        run: node scripts/frontend-release.mjs audit
      - name: Require exact readiness and upload to existing Pages project
        if: inputs.frontend_release_revision != ''
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/frontend-release.mjs upload
      - name: Smoke the actual deployed frontend
        if: inputs.frontend_release_revision != ''
        run: |
          pnpm --filter @swapcircle/web exec playwright install --with-deps chromium
          node scripts/frontend-smoke.mjs
