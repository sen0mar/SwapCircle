name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      api_release_revision:
        description: Optional exact checked SHA for a controlled API release
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.api_release_revision != '' && github.run_id || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.api_release_revision != '') }}
jobs:
  checks:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @swapcircle/web exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failure-evidence
          path: apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore
  database:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The prior full database job used 18 minutes before pairwise coffee coverage.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:start
      - run: pnpm db:setup
      - run: pnpm db:reset
      - run: pnpm db:verify
      - name: Verify migration generation has no drift
        run: |
          pnpm --filter @swapcircle/database generate
          test -z "$(git status --porcelain -- packages/database/migrations)"
      - run: pnpm test:api-local
      - run: pnpm --filter @swapcircle/web exec playwright install --with-deps chromium
      - run: pnpm test:journeys-local
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: local-suite-failure-evidence
          path: |
            test-results/local-*-failure.json
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore
      - if: always()
        run: pnpm db:stop
  private-source-maps:
    # Explicit dispatch is a trusted maintainer operation; PRs never receive secrets.
    if: (github.event_name == 'workflow_dispatch' && inputs.api_release_revision == '') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build with private maps and public revision
        env:
          SENTRY_SOURCE_MAPS: '1'
          VITE_BUILD_REVISION: ${{ github.sha }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
        run: |
          pnpm build
          pnpm --filter @swapcircle/api exec tsc --sourceMap --inlineSources
      - name: Upload and remove private maps
        env:
          BUILD_REVISION: ${{ github.sha }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_API_PROJECT: ${{ vars.SENTRY_API_PROJECT }}
          SENTRY_WEB_PROJECT: ${{ vars.SENTRY_WEB_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: node scripts/sentry-source-maps.mjs
  api-release:
    if: github.event_name == 'workflow_dispatch' && inputs.api_release_revision != ''
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/api-release.yml
    with:
      revision: ${{ inputs.api_release_revision }}
