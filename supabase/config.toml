# Isolated local stack. Drizzle owns all application schema history.
project_id = "swapcircle-local"
[api]
enabled = true
port = 55431
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false
[db]
port = 55432
shadow_port = 55430
major_version = 17
[db.migrations]
enabled = false
schema_paths = []
[db.seed]
enabled = false
sql_paths = []
[realtime]
enabled = true
[studio]
enabled = true
port = 55433
api_url = "http://127.0.0.1"
[local_smtp]
enabled = true
port = 55434
[storage]
enabled = true
[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/auth/callback", "http://127.0.0.1:5173/auth/callback?next=*"]
[auth.email]
enable_signup = false
[edge_runtime]
enabled = false
[analytics]
enabled = false

# db:start enables Google temporarily when both local credentials are present.
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET)"
redirect_uri = "http://127.0.0.1:55431/auth/v1/callback"
